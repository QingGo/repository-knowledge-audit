[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kblint"
version = "0.3.0"
description = "Deterministic, config-driven contract linter for engineering-agent knowledge artifacts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "KB-Health" }]
keywords = ["knowledge-base", "linter", "documentation", "sarif", "deterministic"]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kblint = "kblint.cli:main"

[tool.setuptools.packages.find]
include = ["kblint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
