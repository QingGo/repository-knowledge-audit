name: kblint

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest numpy
      - name: kblint unit tests (42)
        shell: bash
        run: |
          set +e
          PYTHONPATH=kblint python -m pytest -q kblint/tests > /tmp/pytest.log 2>&1
          rc=$?
          cat /tmp/pytest.log
          if [ $rc -ne 0 ]; then
            echo "::error::kblint tests failed (exit $rc); tail follows"
            tail -n 30 /tmp/pytest.log | while IFS= read -r line; do
              echo "::error::${line//%
/%25}"
            done
            exit $rc
          fi
      - name: Audit the bundled sample repository (JSON/Markdown/SARIF)
        run: |
          PYTHONPATH=kblint python -m kblint scan --repo examples/sample-repo \
            --config examples/example-config.yaml --out examples/ci-out \
            --format json,md,sarif --now 2026-11-05 --fail-on none
      - name: Deterministic saved-completion grading (no API)
        run: |
          python benchmark/grader/grade_one.py --task M1_valid_zeros_f32 \
            --code benchmark/grader/examples/saved_pass.py
